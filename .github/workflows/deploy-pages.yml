name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the TanStack application
        run: npm run build

      - name: Prepare static Pages bundle
        run: |
          set -e
          rm -rf pages
          mkdir -p pages
          cp -R .output/public/. pages/
          SERVER_LOG=/tmp/mansour-pages-server.log
          npx --no-install nitro preview --dir . > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            PREVIEW_URL=$(grep -Eo 'https?://(127\\.0\\.0\\.1|localhost):[0-9]+' "$SERVER_LOG" | tail -1 || true)
            if [ -n "$PREVIEW_URL" ] && curl --fail --silent --show-error "$PREVIEW_URL/" > pages/index.html; then
              break
            fi
            sleep 1
          done
          test -s pages/index.html || { cat "$SERVER_LOG"; exit 1; }
          cp pages/index.html pages/404.html
          touch pages/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
